<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Link Page - Interactive</title>
  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #fff;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* Canvas fills entire screen */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* UI Overlay - sits on top of 3D */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none; /* lets clicks pass to 3D if needed */
    }

    .card {
      pointer-events: auto; /* enable clicks on card */
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px;
      padding: 44px 36px 40px;
      max-width: 460px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      text-align: center;
      transition: transform 0.3s ease;
      animation: floatIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card:hover {
      transform: scale(1.01);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 40px rgba(100, 150, 255, 0.3);
      margin-bottom: 16px;
      transition: 0.4s;
    }

    .avatar:hover {
      transform: rotate(6deg) scale(1.04);
      box-shadow: 0 0 60px rgba(100, 150, 255, 0.5);
    }

    .name {
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(135deg, #f0f4ff, #8ab4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.7);
      margin: 6px 0 24px 0;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      padding: 14px 18px;
      border-radius: 60px;
      text-decoration: none;
      color: #eef3ff;
      font-weight: 500;
      font-size: 17px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .link-item i {
      font-size: 22px;
      width: 28px;
      color: #7b9ef7;
      transition: 0.3s;
    }

    .link-item:hover {
      background: rgba(79, 125, 243, 0.20);
      border-color: #4f7df3;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 32px rgba(79, 125, 243, 0.25);
      color: #fff;
    }

    .link-item:active {
      transform: scale(0.97);
    }

    .copy-section {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 60px;
      padding: 4px 4px 4px 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 16px;
    }

    .copy-section input {
      flex: 1;
      background: transparent;
      border: none;
      color: #cfdefa;
      font-size: 14px;
      padding: 10px 0;
      outline: none;
      min-width: 0;
    }

    .copy-section input::placeholder {
      color: #5a6f99;
    }

    .copy-btn {
      background: #4f7df3;
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #4f7df3;
      letter-spacing: 0.3px;
    }

    .copy-btn:hover {
      background: #3b66d9;
      transform: scale(0.96);
      box-shadow: 0 0 28px rgba(79, 125, 243, 0.4);
    }

    .copy-btn:active {
      transform: scale(0.92);
    }

    .toast {
      margin-top: 6px;
      color: #8ab4ff;
      font-size: 13px;
      min-height: 20px;
      opacity: 0;
      transition: 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .social-icon {
      color: rgba(255, 255, 255, 0.5);
      font-size: 26px;
      transition: 0.3s;
      text-decoration: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .social-icon:hover {
      color: #fff;
      background: rgba(79, 125, 243, 0.20);
      border-color: #4f7df3;
      transform: translateY(-4px);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.5px;
    }

    .footer-note i {
      margin-right: 4px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 32px 20px 28px;
        border-radius: 32px;
      }
      .link-item {
        font-size: 15px;
        padding: 12px 14px;
      }
      .name {
        font-size: 26px;
      }
      .avatar {
        width: 80px;
        height: 80px;
      }
    }

    /* Font Awesome fallback */
    .no-icon i::before {
      content: "🔗";
    }
  </style>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="overlay">
    <div class="card" id="app">

      <img class="avatar" src="https://ui-avatars.com/api/?background=4f7df3&color=fff&size=100&name=Your+Name" alt="Avatar" />

      <h1 class="name">Your Name</h1>
      <p class="bio">✨ Connect with me · 3D Universe ✨</p>

      <div class="links">
        <a href="#" class="link-item" target="_blank">
          <i class="fab fa-instagram"></i> Instagram
        </a>
        <a href="#" class="link-item" target="_blank">
          <i class="fab fa-tiktok"></i> TikTok
        </a>
        <a href="#" class="link-item" target="_blank">
          <i class="fab fa-facebook"></i> Facebook
        </a>
        <a href="#" class="link-item" target="_blank">
          <i class="fab fa-youtube"></i> YouTube
        </a>
        <a href="#" class="link-item" target="_blank">
          <i class="fas fa-link"></i> Portfolio
        </a>
      </div>

      <div class="copy-section">
        <input type="text" id="pageLink" value="https://your-link.page" readonly />
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div id="toast" class="toast">✅ Copied!</div>

      <div class="social-row">
        <a href="#" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-icon" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="#" class="social-icon" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="#" class="social-icon" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="#" class="social-icon" target="_blank"><i class="fab fa-github"></i></a>
      </div>

      <div class="footer-note">
        <i class="fas fa-arrow-up"></i> Drag to rotate · Scroll to zoom
      </div>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

    // --- Setup Scene, Camera, Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Controls (Orbit) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minPolarAngle = Math.PI / 4;
    controls.target.set(0, 0, 0);

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(2, 3, 4);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x4f7df3, 0.6);
    fillLight.position.set(-3, -1, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x8ab4ff, 0.8);
    rimLight.position.set(0, -2, -5);
    scene.add(rimLight);

    const pointLight = new THREE.PointLight(0x4f7df3, 0.5, 10);
    pointLight.position.set(1, 2, 3);
    scene.add(pointLight);

    // --- 3D Objects ---

    // 1. Main Torus Knot (colorful centerpiece)
    const knotGeo = new THREE.TorusKnotGeometry(1.2, 0.4, 128, 16);
    const knotMat = new THREE.MeshPhysicalMaterial({
      color: 0x4f7df3,
      emissive: 0x1a2b5c,
      roughness: 0.2,
      metalness: 0.7,
      clearcoat: 0.3,
      clearcoatRoughness: 0.4,
      emissiveIntensity: 0.3,
    });
    const knot = new THREE.Mesh(knotGeo, knotMat);
    knot.castShadow = true;
    knot.receiveShadow = true;
    scene.add(knot);

    // 2. Floating ring around knot
    const ringGeo = new THREE.TorusGeometry(1.8, 0.05, 32, 64);
    const ringMat = new THREE.MeshPhysicalMaterial({
      color: 0x8ab4ff,
      emissive: 0x2a4a8a,
      roughness: 0.3,
      metalness: 0.5,
      transparent: true,
      opacity: 0.5,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 3;
    ring.rotation.z = Math.PI / 4;
    scene.add(ring);

    // 3. Small orbiting particles (stars)
    const starsGroup = new THREE.Group();
    const particleCount = 120;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const radius = 2.8 + Math.random() * 2.2;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6;
      positions[i*3+2] = radius * Math.cos(phi);

      const color = new THREE.Color().setHSL(0.6 + Math.random()*0.2, 0.8, 0.5 + Math.random()*0.3);
      colors[i*3] = color.r;
      colors[i*3+1] = color.g;
      colors[i*3+2] = color.b;

      sizes[i] = 0.02 + Math.random() * 0.06;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMat = new THREE.PointsMaterial({
      size: 0.08,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // 4. Glowing background dust (extra particles)
    const dustGeo = new THREE.BufferGeometry();
    const dustCount = 400;
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount * 3; i++) {
      dustPos[i] = (Math.random() - 0.5) * 20;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0x4f7df3,
      size: 0.015,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending,
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    // 5. Subtle grid floor (for depth)
    const gridHelper = new THREE.GridHelper(6, 20, 0x4f7df3, 0x1a2b5c);
    gridHelper.position.y = -2.2;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.15;
    scene.add(gridHelper);

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotate knot
      knot.rotation.x += 0.005;
      knot.rotation.y += 0.01;
      
      // Rotate ring
      ring.rotation.y += 0.005;
      ring.rotation.x += 0.003;

      // Rotate particles slowly
      particles.rotation.y += 0.001;
      particles.rotation.x += 0.0005;

      dust.rotation.y += 0.0003;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- Resize Handler ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // --- Toggle auto-rotate on user interaction ---
    renderer.domElement.addEventListener('pointerdown', () => {
      controls.autoRotate = false;
    });
    renderer.domElement.addEventListener('pointerup', () => {
      // Re-enable auto-rotate after 3 seconds of idle
      setTimeout(() => {
        controls.autoRotate = true;
      }, 3000);
    });

    // Also re-enable when user stops interacting
    let timeoutId;
    renderer.domElement.addEventListener('pointermove', () => {
      controls.autoRotate = false;
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        controls.autoRotate = true;
      }, 3000);
    });

    console.log('🚀 3D Link Page loaded!');
  </script>

  <!-- Copy functionality (non-module) -->
  <script>
    (function() {
      const copyBtn = document.getElementById('copyBtn');
      const linkInput = document.getElementById('pageLink');
      const toast = document.getElementById('toast');

      copyBtn.addEventListener('click', function() {
        linkInput.select();
        linkInput.setSelectionRange(0, 99999);

        try {
          navigator.clipboard.writeText(linkInput.value).then(() => {
            showToast('✅ Copied to clipboard!');
          }).catch(() => {
            document.execCommand('copy');
            showToast('📋 Copied!');
          });
        } catch (e) {
          document.execCommand('copy');
          showToast('📋 Copied!');
        }

        window.getSelection().removeAllRanges();
      });

      linkInput.addEventListener('click', function() {
        this.select();
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
      }

      // Auto-fill links (example - replace with your actual links)
      const links = {
        instagram: 'https://instagram.com/yourusername',
        tiktok: 'https://tiktok.com/@yourusername',
        facebook: 'https://facebook.com/yourusername',
        youtube: 'https://youtube.com/@yourusername',
        website: 'https://yourwebsite.com',
        twitter: 'https://twitter.com/yourusername',
        github: 'https://github.com/yourusername'
      };

      document.querySelectorAll('.link-item').forEach(item => {
        const icon = item.querySelector('i');
        if (!icon) return;
        const cls = icon.className;
        if (cls.includes('instagram')) item.href = links.instagram;
        else if (cls.includes('tiktok')) item.href = links.tiktok;
        else if (cls.includes('facebook')) item.href = links.facebook;
        else if (cls.includes('youtube')) item.href = links.youtube;
        else if (cls.includes('fa-link')) item.href = links.website;
      });

      document.querySelectorAll('.social-icon').forEach(item => {
        const icon = item.querySelector('i');
        if (!icon) return;
        const cls = icon.className;
        if (cls.includes('instagram')) item.href = links.instagram;
        else if (cls.includes('tiktok')) item.href = links.tiktok;
        else if (cls.includes('facebook')) item.href = links.facebook;
        else if (cls.includes('twitter')) item.href = links.twitter;
        else if (cls.includes('github')) item.href = links.github;
      });
    })();
  </script>
</body>
</html>
