<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Link Manager - Login & Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff, #8ab4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Auth Forms (Login / Signup) */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .auth-form input {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .auth-form input:focus {
            border-color: #4f7df3;
            background: rgba(79, 125, 243, 0.08);
            box-shadow: 0 0 20px rgba(79, 125, 243, 0.1);
        }

        .auth-form input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: #4f7df3;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #4f7df3;
            width: 100%;
        }

        .btn-primary:hover {
            background: #3b66d9;
            transform: scale(0.98);
            box-shadow: 0 0 30px rgba(79, 125, 243, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .auth-toggle span {
            color: #4f7df3;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .auth-toggle span:hover {
            color: #8ab4ff;
            text-decoration: underline;
        }

        /* Dashboard (after login) */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #4f7df3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
        }

        .user-name {
            font-weight: 600;
            font-size: 18px;
        }

        .user-email {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 70, 70, 0.15);
            border-color: rgba(255, 70, 70, 0.3);
            color: #ff6b6b;
        }

        /* Add Link Form */
        .add-link-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .add-link-section h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .add-link-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add-link-form input,
        .add-link-form select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .add-link-form input:focus,
        .add-link-form select:focus {
            border-color: #4f7df3;
            background: rgba(79, 125, 243, 0.06);
        }

        .add-link-form input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .add-link-form select option {
            background: #1a1a3e;
            color: #fff;
        }

        .add-link-row {
            display: flex;
            gap: 10px;
        }

        .add-link-row input {
            flex: 1;
        }

        .btn-small {
            padding: 12px 20px;
            background: #4f7df3;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-small:hover {
            background: #3b66d9;
            transform: scale(0.97);
        }

        .btn-small-danger {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
        }

        .btn-small-danger:hover {
            background: rgba(255, 70, 70, 0.25);
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .links-list::-webkit-scrollbar {
            width: 4px;
        }

        .links-list::-webkit-scrollbar-thumb {
            background: #4f7df3;
            border-radius: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(79, 125, 243, 0.2);
        }

        .link-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .link-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(79, 125, 243, 0.12);
            color: #4f7df3;
            flex-shrink: 0;
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-platform {
            font-weight: 600;
            font-size: 14px;
        }

        .link-url {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-actions {
            display: flex;
            gap: 6px;
        }

        .link-actions button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.3s;
            font-size: 14px;
        }

        .link-actions button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .link-actions .delete-btn:hover {
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            padding: 30px 0;
            font-size: 14px;
        }

        .empty-state i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.08);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: 0.4s;
            z-index: 999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Hide/show */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 28px 18px;
                border-radius: 32px;
            }
            .add-link-row {
                flex-direction: column;
            }
            .user-header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        /* Platform colors for icons */
        .platform-instagram .link-icon {
            background: rgba(225, 48, 108, 0.15);
            color: #e1306c;
        }
        .platform-tiktok .link-icon {
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        .platform-facebook .link-icon {
            background: rgba(24, 119, 242, 0.15);
            color: #1877f2;
        }
        .platform-youtube .link-icon {
            background: rgba(255, 0, 0, 0.15);
            color: #ff0000;
        }
        .platform-twitter .link-icon {
            background: rgba(29, 161, 242, 0.15);
            color: #1da1f2;
        }
        .platform-github .link-icon {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .platform-linkedin .link-icon {
            background: rgba(0, 119, 181, 0.15);
            color: #0077b5;
        }
        .platform-snapchat .link-icon {
            background: rgba(255, 252, 0, 0.15);
            color: #fffc00;
        }
        .platform-pinterest .link-icon {
            background: rgba(189, 8, 28, 0.15);
            color: #bd081c;
        }
        .platform-reddit .link-icon {
            background: rgba(255, 69, 0, 0.15);
            color: #ff4500;
        }
        .platform-default .link-icon {
            background: rgba(79, 125, 243, 0.12);
            color: #4f7df3;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Header -->
        <h1>🔗 Link Manager</h1>
        <p class="subtitle">Manage all your social links in one place</p>

        <!-- ========== LOGIN FORM ========== -->
        <div id="loginForm">
            <form class="auth-form" id="loginFormElement">
                <input type="email" id="loginEmail" placeholder="Email address" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <div class="auth-toggle">
                Don't have an account? <span id="goToSignup">Create one</span>
            </div>
        </div>

        <!-- ========== SIGNUP FORM ========== -->
        <div id="signupForm" class="hidden">
            <form class="auth-form" id="signupFormElement">
                <input type="text" id="signupName" placeholder="Full name" required />
                <input type="email" id="signupEmail" placeholder="Email address" required />
                <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" minlength="6" required />
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <div class="auth-toggle">
                Already have an account? <span id="goToLogin">Sign in</span>
            </div>
        </div>

        <!-- ========== DASHBOARD ========== -->
        <div id="dashboard" class="dashboard">
            <!-- User header -->
            <div class="user-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userDisplayName">User</div>
                        <div class="user-email" id="userDisplayEmail">email@example.com</div>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>

            <!-- Add Link -->
            <div class="add-link-section">
                <h3>➕ Add New Link</h3>
                <div class="add-link-form">
                    <select id="platformSelect">
                        <option value="instagram">📸 Instagram</option>
                        <option value="tiktok">🎵 TikTok</option>
                        <option value="facebook">📘 Facebook</option>
                        <option value="youtube">▶️ YouTube</option>
                        <option value="twitter">🐦 Twitter</option>
                        <option value="github">💻 GitHub</option>
                        <option value="linkedin">💼 LinkedIn</option>
                        <option value="snapchat">👻 Snapchat</option>
                        <option value="pinterest">📌 Pinterest</option>
                        <option value="reddit">🤖 Reddit</option>
                        <option value="other">🔗 Other</option>
                    </select>
                    <div class="add-link-row">
                        <input type="text" id="linkUrlInput" placeholder="https://instagram.com/username" />
                        <button class="btn-small" id="addLinkBtn">Add</button>
                    </div>
                </div>
            </div>

            <!-- Links List -->
            <div id="linksContainer">
                <div class="links-list" id="linksList">
                    <!-- Links rendered here -->
                </div>
            </div>

            <!-- Share section -->
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.04);">
                <p style="font-size: 13px; color: rgba(255,255,255,0.3); text-align: center;">
                    <i class="fas fa-share-alt" style="margin-right: 6px;"></i>
                    Your profile link: <span id="profileLink" style="color: #4f7df3; cursor: pointer;">https://your-link.com/user</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  DATA LAYER - using LocalStorage
        // ============================================================

        const STORAGE_KEY = 'linkManagerDB';

        function getDB() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) return { users: [] };
            try { return JSON.parse(data); } catch { return { users: [] }; }
        }

        function saveDB(db) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        function findUserByEmail(email) {
            const db = getDB();
            return db.users.find(u => u.email === email) || null;
        }

        function createUser(name, email, password) {
            const db = getDB();
            if (db.users.find(u => u.email === email)) return null; // already exists
            const user = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name,
                email,
                password, // In production, hash this!
                links: [],
                createdAt: new Date().toISOString()
            };
            db.users.push(user);
            saveDB(db);
            return user;
        }

        function addLinkToUser(email, platform, url) {
            const db = getDB();
            const user = db.users.find(u => u.email === email);
            if (!user) return false;
            user.links.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                platform,
                url,
                addedAt: new Date().toISOString()
            });
            saveDB(db);
            return true;
        }

        function removeLinkFromUser(email, linkId) {
            const db = getDB();
            const user = db.users.find(u => u.email === email);
            if (!user) return false;
            user.links = user.links.filter(l => l.id !== linkId);
            saveDB(db);
            return true;
        }

        function updateUserLinks(email, links) {
            const db = getDB();
            const user = db.users.find(u => u.email === email);
            if (!user) return false;
            user.links = links;
            saveDB(db);
            return true;
        }

        // ============================================================
        //  AUTH / SESSION
        // ============================================================

        let currentUser = null;

        function getCurrentUser() {
            const saved = sessionStorage.getItem('linkManagerSession');
            if (!saved) return null;
            try {
                const parsed = JSON.parse(saved);
                const user = findUserByEmail(parsed.email);
                if (user && user.password === parsed.password) {
                    currentUser = user;
                    return user;
                }
            } catch { /* ignore */ }
            return null;
        }

        function setSession(user) {
            sessionStorage.setItem('linkManagerSession', JSON.stringify({
                email: user.email,
                password: user.password
            }));
            currentUser = user;
        }

        function clearSession() {
            sessionStorage.removeItem('linkManagerSession');
            currentUser = null;
        }

        // ============================================================
        //  UI RENDERING
        // ============================================================

        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const dashboard = document.getElementById('dashboard');
        const linksList = document.getElementById('linksList');

        function showToast(msg, duration = 2500) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), duration);
        }

        function renderLinks() {
            if (!currentUser) return;
            const links = currentUser.links || [];
            if (links.length === 0) {
                linksList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-link"></i>
                        No links added yet.<br />
                        Add your first social link above!
                    </div>
                `;
                return;
            }

            const platformIcons = {
                instagram: '📸',
                tiktok: '🎵',
                facebook: '📘',
                youtube: '▶️',
                twitter: '🐦',
                github: '💻',
                linkedin: '💼',
                snapchat: '👻',
                pinterest: '📌',
                reddit: '🤖',
                other: '🔗'
            };

            const platformNames = {
                instagram: 'Instagram',
                tiktok: 'TikTok',
                facebook: 'Facebook',
                youtube: 'YouTube',
                twitter: 'Twitter',
                github: 'GitHub',
                linkedin: 'LinkedIn',
                snapchat: 'Snapchat',
                pinterest: 'Pinterest',
                reddit: 'Reddit',
                other: 'Other'
            };

            let html = '';
            links.forEach(link => {
                const icon = platformIcons[link.platform] || '🔗';
                const name = platformNames[link.platform] || link.platform;
                const platformClass = `platform-${link.platform}`;
                html += `
                    <div class="link-card ${platformClass}">
                        <div class="link-card-left">
                            <div class="link-icon">${icon}</div>
                            <div class="link-info">
                                <div class="link-platform">${name}</div>
                                <div class="link-url">${link.url}</div>
                            </div>
                        </div>
                        <div class="link-actions">
                            <button class="delete-btn" data-link-id="${link.id}" title="Delete">✕</button>
                        </div>
                    </div>
                `;
            });

            linksList.innerHTML = html;

            // Delete handlers
            linksList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const linkId = this.dataset.linkId;
                    if (confirm('Delete this link?')) {
                        if (removeLinkFromUser(currentUser.email, linkId)) {
                            currentUser = findUserByEmail(currentUser.email);
                            setSession(currentUser);
                            renderLinks();
                            showToast('🗑️ Link deleted');
                            updateProfileLink();
                        }
                    }
                });
            });
        }

        function updateDashboardUI() {
            if (!currentUser) return;
            document.getElementById('userDisplayName').textContent = currentUser.name;
            document.getElementById('userDisplayEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
            renderLinks();
            updateProfileLink();
        }

        function updateProfileLink() {
            const link = document.getElementById('profileLink');
            const base = window.location.origin + window.location.pathname;
            link.textContent = `${base}?user=${currentUser.email}`;
        }

        function showDashboard() {
            loginForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            dashboard.classList.add('active');
            updateDashboardUI();
        }

        function showLogin() {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            dashboard.classList.remove('active');
        }

        function showSignup() {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            dashboard.classList.remove('active');
        }

        // ============================================================
        //  EVENT HANDLERS
        // ============================================================

        // Login
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const user = findUserByEmail(email);
            if (!user || user.password !== password) {
                showToast('❌ Invalid email or password');
                return;
            }

            setSession(user);
            currentUser = user;
            showDashboard();
            showToast('✅ Welcome back, ' + user.name + '!');
            document.getElementById('loginFormElement').reset();
        });

        // Signup
        document.getElementById('signupFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || password.length < 6) {
                showToast('❌ Please fill all fields (password min 6 chars)');
                return;
            }

            const user = createUser(name, email, password);
            if (!user) {
                showToast('❌ Email already registered');
                return;
            }

            setSession(user);
            currentUser = user;
            showDashboard();
            showToast('🎉 Account created! Welcome ' + name);
            document.getElementById('signupFormElement').reset();
        });

        // Toggle forms
        document.getElementById('goToSignup').addEventListener('click', showSignup);
        document.getElementById('goToLogin').addEventListener('click', showLogin);

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Logout?')) {
                clearSession();
                showLogin();
                showToast('👋 Logged out');
            }
        });

        // Add Link
        document.getElementById('addLinkBtn').addEventListener('click', function() {
            if (!currentUser) return;
            const platform = document.getElementById('platformSelect').value;
            const url = document.getElementById('linkUrlInput').value.trim();

            if (!url) {
                showToast('❌ Please enter a URL');
                return;
            }

            // Basic URL validation
            try {
                new URL(url);
            } catch {
                showToast('❌ Please enter a valid URL (include https://)');
                return;
            }

            if (addLinkToUser(currentUser.email, platform, url)) {
                currentUser = findUserByEmail(currentUser.email);
                setSession(currentUser);
                renderLinks();
                document.getElementById('linkUrlInput').value = '';
                showToast('✅ Link added!');
                updateProfileLink();
            }
        });

        // Enter key on URL input
        document.getElementById('linkUrlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('addLinkBtn').click();
            }
        });

        // Copy profile link on click
        document.getElementById('profileLink').addEventListener('click', function() {
            const text = this.textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Profile link copied!');
            }).catch(() => {
                // Fallback
                const range = document.createRange();
                range.selectNode(this);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                showToast('📋 Copied!');
            });
        });

        // ============================================================
        //  INIT
        // ============================================================

        // Check for user param in URL (for sharing)
        const params = new URLSearchParams(window.location.search);
        const sharedUser = params.get('user');
        if (sharedUser) {
            // Just show a toast; the user can log in
            setTimeout(() => {
                showToast('🔗 You are viewing ' + sharedUser + '\'s profile link', 3000);
            }, 500);
        }

        // Auto-login if session exists
        const sessionUser = getCurrentUser();
        if (sessionUser) {
            currentUser = sessionUser;
            showDashboard();
        } else {
            showLogin();
        }

        console.log('🚀 Link Manager loaded!');
        console.log('👤 Current user:', currentUser);
    </script>
</body>
</html>
